[package]
name = "api"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["full-local"]
aws = ["aws-smithy-types"]
aws-s3 = ["aws", "aws-sdk-s3", "infra/aws-s3"]
aws-dynamodb = ["aws", "aws-sdk-dynamodb", "infra/aws-dynamodb"]
image = ["dep:image"]
jwt = ["jsonwebtoken", "jsonwebtoken/rust_crypto"]
jwt-secret-store-aws-ssm = ["jwt", "aws", "aws-sdk-ssm"]
jwt-secret-store-static = ["jwt"]
storage-aws-s3 = ["aws", "aws-s3"]
storage-local = []
session-store-redis = ["infra/session-store-redis"]
session-store-aws-dynamodb = ["aws-dynamodb", "infra/session-store-aws-dynamodb"]

# 기능(functional) feature — 끌 수 있는 능력 단위. board는 board_files→fs::files 때문에 file 의존.
board = ["file", "entity/board"]
file = ["entity/file"]
# membership 알림(구독 만료/잔액 부족)이 mail-form을 사용하므로 의존으로 명시.
membership = ["mail-form", "entity/membership"]
mail-form = ["entity/mail-form"]
# 공용 운영 설정 — full-features 에 미포함. 필요한 소비자가 개별 enable 한다.
system-settings = ["entity/system-settings"]
# 기능 전체 묶음(기존 소비자 무영향: full-*가 전부 포함)
full-features = ["board", "file", "membership", "mail-form"]

full-local = ["image", "jwt-secret-store-static", "storage-local", "session-store-redis", "full-features"]
full-aws = [
  "aws-s3",
  "image",
  "jwt-secret-store-aws-ssm",
  "storage-aws-s3",
  "session-store-aws-dynamodb",
  "full-features",
]

[dev-dependencies]
e2e = { path = "../e2e" }
# 멤버십 유지보수는 만기된 구독을 **데이터베이스 전체에서** 훑는다. 한 케이스가 그것을 부르면
# 옆 케이스가 방금 만료시켜 둔 구독까지 처리해 버려서, 옆 케이스의 단언이 무작위로 깨진다.
# `#[serial]` 을 단 케이스끼리만 줄을 세우고 나머지 스위트는 병렬로 둔다.
serial_test = "3"
# 플랫 필터 파라미터를 실제 쿼리스트링 그대로 파싱해 보기 위한 것. axum 이 `Query` 에 쓰는 것과
# 같은 파서라, 테스트가 통과하면 라우트에서도 같게 읽힌다.
serde_urlencoded = "0.7.1"

[dependencies]
# default-features=false: if infra's default (session-store-redis) is force-enabled,
# jwt.rs's cfg_if always picks the redis branch, killing DynamoJwtStore even on full-aws.
# Pass only the session-store-* that api enables, explicitly.
infra = { path = "../infra", default-features = false }
entity = { path = "../entity" }
error = { path = "../error" }

anyhow = { workspace = true }
argon2 = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
cfg-if = { workspace = true }
chrono = { workspace = true }
humantime = { workspace = true }
inventory = "0.3"
rand = { workspace = true }
lettre = { workspace = true }
sea-orm = { workspace = true }
sea-orm-crud = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_with = { workspace = true }
tinytemplate = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
tower-sessions-core = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
sysinfo = { workspace = true }

aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-ssm = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
aws-smithy-types = { workspace = true, optional = true }
image = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }

axum-extra = { version = "0.12.1", features = ["query"] }
futures = "0.3.31"
markdown = { version = "1.0.0" }
scraper = "0.25.0"
serde_qs = { version = "1.0.0", features = ["axum"] }
