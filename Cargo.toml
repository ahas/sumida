[package]
name = "sumida"
version = "0.1.0"
edition = "2021"

[features]
default = []

aws = ["aws-config"]
aws-dynamodb = ["aws", "aws-sdk-dynamodb"]
aws-s3 = ["aws", "aws-sdk-s3"]
image = ["dep:image"]

session = []
session-store-redis = ["session", "tower-sessions-redis-store"]
session-store-aws-dynamodb = [
  "session",
  "aws-dynamodb",
  "tower-sessions-dynamodb-store",
]

jwt = ["jsonwebtoken"]
jwt-secret-store-aws-ssm = ["jwt", "aws", "aws-sdk-ssm"]
jwt-secret-store-static = ["jwt"]

storage-aws-s3 = ["aws", "aws-s3"]
storage-local = []
jsonwebtoken = ["dep:jsonwebtoken"]

messenger = ["socketioxide", "socketioxide-core"]
socketioxide-core = ["dep:socketioxide-core"]

[dependencies]
anyhow = "1.0.95"
axum = { version = "0.8.1", features = ["macros", "multipart"] }
rand = "0.9.0"
sea-orm = { version = "1.1.4", features = [
  "sqlx-postgres",
  "postgres-array",
  "macros",
  "runtime-tokio-rustls",
] }
sea-orm-crud = { version = "0.1.0", path = "../sea-orm-crud" }
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
tower-sessions = "0.14.0"

# optional
tower-sessions-redis-store = { version = "0.16.0", optional = true }
tower-sessions-dynamodb-store = { version = "0.3.0", optional = true }
aws-config = { version = "1.5.13", optional = true }
aws-sdk-s3 = { version = "1.68.0", optional = true }
aws-sdk-ssm = { version = "1.59.0", optional = true }
aws-sdk-dynamodb = { version = "1.59.0", optional = true }
jsonwebtoken = { version = "9.3.0", optional = true }
image = { version = "0.25.5", optional = true }
socketioxide = { version = "0.16.1", features = ["state"], optional = true }
socketioxide-core = { version = "0.16.0", optional = true }

argon2 = "0.5.3"
chrono = { version = "0.4.39", features = ["serde"] }
uuid = { version = "1.13.1", features = ["v4", "serde"] }
lettre = "0.11.12"
tinytemplate = "1.2.1"
tokio = "1.43.0"
tracing = "0.1.41"
tower-http = { version = "0.6.2", features = ["full"] }
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
config = "0.15.8"
lazy_static = "1.5.0"
thiserror = "2.0.11"
sea-orm-migration = { version = "1.1.4", features = ["sqlx-postgres"] }
