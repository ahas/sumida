[package]
name = "sumida"
version = "0.1.0"
edition = "2021"

[features]
default = []
full-local = [
  "image",
  "session-store-redis",
  "jwt-secret-store-static",
  "storage-local",
]
full-aws = [
  "image",
  "session-store-aws-dynamodb",
  "jwt-secret-store-aws-ssm",
  "storage-aws-s3",
]
test-suite = ["full-local"]

aws-dynamodb = ["core/aws-dynamodb"]
aws-s3 = ["core/aws-s3", "api/aws-s3"]
image = ["api/image"]

session = []
session-store-redis = ["session", "core/session-store-redis"]
session-store-aws-dynamodb = ["session", "core/session-store-aws-dynamodb"]

jwt = []
jwt-secret-store-aws-ssm = ["jwt", "api/jwt-secret-store-aws-ssm"]
jwt-secret-store-static = ["jwt", "api/jwt-secret-store-static"]

storage-aws-s3 = ["api/storage-aws-s3"]
storage-local = ["api/storage-local"]

[workspace]
resolver = "2"
members = ["api", "core", "entity"]

[workspace.dependencies]
anyhow = "1.0.98"
argon2 = "0.5.3"
aws-config = "1.6.3"
aws-sdk-s3 = "1.90.0"
aws-sdk-ssm = "1.79.0"
aws-sdk-dynamodb = "1.78.0"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
chrono = { version = "0.4.41", features = ["serde"] }
humantime = "2.2.0"
image = "0.25.6"
jsonwebtoken = "9.3.1"
lettre = "0.11.15"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
sea-orm = { version = "1.1.12", features = [
  "sqlx-postgres",
  "postgres-array",
  "macros",
  "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1.1.12", features = ["sqlx-postgres"] }
sea-orm-crud = { git = "https://github.com/ahas/sea-orm-crud.git" }
tinytemplate = "1.2.1"
time = "0.3.41"


[dependencies]
api = { path = "./api", default-features = false }
core = { path = "./core", default-features = false }
entity = { path = "./entity", default-features = false }
