[package]
name = "sumida"
version = "0.2.0"
edition = "2024"

[features]
default = []
full-local = [
  "image",
  "session-store-redis",
  "jwt-secret-store-static",
  "storage-local",
  "full-features",
]
full-aws = [
  "image",
  "session-store-aws-dynamodb",
  "jwt-secret-store-aws-ssm",
  "storage-aws-s3",
  "full-features",
]
test-suite = ["full-local"]

# 기능(functional) feature — 끌 수 있는 능력 단위. board는 file 의존(board_files→fs::files).
# full-* 번들이 전부 포함하므로 그 번들을 쓰는 소비자는 무영향.
board = ["api/board"]
file = ["api/file"]
membership = ["api/membership"]
mail-form = ["api/mail-form"]
# 공용 운영 설정 — full-features 에 미포함. 필요한 소비자가 개별 enable 한다.
system-settings = ["api/system-settings"]
full-features = ["board", "file", "membership", "mail-form"]

aws-dynamodb = ["infra/aws-dynamodb"]
aws-s3 = ["infra/aws-s3", "api/aws-s3"]
image = ["api/image"]

# 이 배포가 세우는 라우트를 서술한 문서 조각. 소비자가 자기 문서에 합쳐 쓴다.
openapi = ["api/openapi"]

session = []
session-store-redis = ["session", "infra/session-store-redis", "api/session-store-redis"]
session-store-aws-dynamodb = [
  "session",
  "infra/session-store-aws-dynamodb",
  "api/session-store-aws-dynamodb",
]

jwt = []
jwt-secret-store-aws-ssm = ["jwt", "api/jwt-secret-store-aws-ssm"]
jwt-secret-store-static = ["jwt", "api/jwt-secret-store-static"]

storage-aws-s3 = ["api/storage-aws-s3"]
storage-local = ["api/storage-local"]

[workspace]
resolver = "2"
members = ["api", "infra", "entity", "error", "examples/*", "e2e"]
default-members = ["examples/basic"]

[workspace.dependencies]
sea-orm-crud = { git = "https://github.com/ahas/sea-orm-crud", rev = "b6df446af3dc31ffc18f0379e0ef628c9bcb3cf2" }

anyhow = "1.0.98"
argon2 = "0.5.3"
async-trait = "0.1.89"
aws-config = "1.6.3"
aws-sdk-s3 = "1.90.0"
aws-sdk-ssm = "1.79.0"
aws-sdk-dynamodb = "1.78.0"
aws-smithy-types = "1.3.1"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
blake3 = "1.8.2"
cfg-if = "1.0.0"
chrono = { version = "0.4.41", features = ["serde"] }
humantime = "2.2.0"
image = "0.25.6"
jsonwebtoken = "10.1.0"
lazy_static = "1.5.0"
# rustls 를 쓴다. musl 정적 링크에서 OpenSSL 은 시스템 라이브러리를 찾지 못하고, 벤더링하면
# 빌드에 C 툴체인이 끼어든다. 메일 전송은 백엔드에 무관한 API 만 쓰므로 고를 수 있는 자리다.
lettre = { version = "0.11.18", default-features = false, features = [
  "smtp-transport",
  "pool",
  "hostname",
  "builder",
  "rustls-tls",
] }
rand = "0.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
serde_with = { version = "3.15.1", features = ["base64", "chrono"] }
sea-orm = { version = "1.1.17", features = [
  "sqlx-postgres",
  "postgres-array",
  "macros",
  "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1.1.17", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
tinytemplate = "1.2.1"
time = "0.3.41"
tokio = { version = "1.47.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1.17"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["full"] }
tower-sessions = "0.14.0"
tower-sessions-core = "0.14.0"
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
# 문서 서술은 핸들러와 타입 **옆**에 붙는 매크로다. 라우터 타입도 시그니처도 건드리지 않으므로
# 이 크레이트를 링크하지 않는 소비자는 아무것도 달라지지 않는다.
utoipa = { version = "5.5.0", features = ["chrono", "config", "uuid"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
sysinfo = "0.38.2"
reqwest = { version = "0.13.2", features = ["json"] }
hmac = "0.12.1"
sha2 = "0.10.9"

[dependencies]
api = { path = "./api", default-features = false }
infra = { path = "./infra", default-features = false }
entity = { path = "./entity", default-features = false }
error = { path = "./error", default-features = false }

aws-smithy-types.workspace = true
cfg-if.workspace = true

# e2e forces api to full-local, so keeping it as a regular dependency leaks
# full-local into the root full-aws build via feature unification (DynamoJwtStore dies again).
# It is only needed for tests, so isolate it as a dev-dependency.
[dev-dependencies]
e2e = { path = "./e2e", default-features = false }

# 링커가 디버그 정보를 통째로 안고 있느라 빌드가 겹치면 OOM 이 난다. 실측 기준 링크 피크
# 7.07GB → 3.50GB.
# 디버그 정보를 줄 번호까지만 남긴다. 백트레이스는 그대로 읽히고, 디버거로 변수를 들여다보는
# 것만 포기한다. 정적 링크라 테스트 바이너리 하나가 의존성을 통째로 품는데, 그중 생성 코드가
# 거대한 크레이트(EC2 SDK 같은)가 섞이면 풀 디버그 정보로는 산출물이 기가 단위로 간다.
# `split-debuginfo` 는 그것을 바이너리 밖으로 옮길 뿐 양을 줄이지 않는다.
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"
