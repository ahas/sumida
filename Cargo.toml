[package]
name = "sumida"
version = "0.1.0"
edition = "2024"

[features]
default = []
full-local = [
  "image",
  "session-store-redis",
  "jwt-secret-store-static",
  "storage-local",
]
full-aws = [
  "image",
  "session-store-aws-dynamodb",
  "jwt-secret-store-aws-ssm",
  "storage-aws-s3",
]
test-suite = ["full-local"]

aws-dynamodb = ["infra/aws-dynamodb"]
aws-s3 = ["infra/aws-s3", "api/aws-s3"]
image = ["api/image"]

session = []
session-store-redis = ["session", "infra/session-store-redis"]
session-store-aws-dynamodb = ["session", "infra/session-store-aws-dynamodb"]

jwt = []
jwt-secret-store-aws-ssm = ["jwt", "api/jwt-secret-store-aws-ssm"]
jwt-secret-store-static = ["jwt", "api/jwt-secret-store-static"]

storage-aws-s3 = ["api/storage-aws-s3"]
storage-local = ["api/storage-local"]

[workspace]
resolver = "2"
members = ["api", "infra", "entity", "error", "examples/*", "e2e"]
default-members = ["examples/basic"]

[workspace.dependencies]
sea-orm-crud = { path = "../sea-orm-crud" }

anyhow = "1.0.98"
argon2 = "0.5.3"
async-trait = "0.1.89"
aws-config = "1.6.3"
aws-sdk-s3 = "1.90.0"
aws-sdk-ssm = "1.79.0"
aws-sdk-dynamodb = "1.78.0"
aws-smithy-types = "1.3.1"
axum = { version = "0.8.4", features = ["macros", "multipart"] }
blake3 = "1.8.2"
cfg-if = "1.0.0"
chrono = { version = "0.4.41", features = ["serde"] }
humantime = "2.2.0"
image = "0.25.6"
jsonwebtoken = "10.1.0"
lazy_static = "1.5.0"
lettre = "0.11.18"
rand = "0.10.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.138"
serde_with = { version = "3.15.1", features = ["base64", "chrono"] }
sea-orm = { version = "1.1.17", features = [
  "sqlx-postgres",
  "postgres-array",
  "macros",
  "runtime-tokio-rustls",
] }
sea-orm-migration = { version = "1.1.17", features = [
  "runtime-tokio-rustls",
  "sqlx-postgres",
] }
tinytemplate = "1.2.1"
time = "0.3.41"
tokio = { version = "1.47.0", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tokio-stream = "0.1.17"
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["full"] }
tower-sessions = "0.14.0"
tower-sessions-core = "0.14.0"
tracing = "0.1.41"
uuid = { version = "1.17.0", features = ["v4", "serde"] }
base64 = { version = "0.22.1", default-features = false, features = ["alloc"] }
sysinfo = "0.38.2"

[dependencies]
api = { path = "./api", default-features = false }
infra = { path = "./infra", default-features = false }
entity = { path = "./entity", default-features = false }
error = { path = "./error", default-features = false }
e2e = { path = "./e2e", default-features = false }

aws-smithy-types.workspace = true
cfg-if.workspace = true
