[package]
name = "entity"
version = "0.2.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
# 기능별 엔티티/마이그레이션 게이팅. board는 board_files→fs::files 때문에 file 의존.
board = ["file"]
file = []
membership = []
mail-form = []
# 공용 운영 설정. full-features 에 넣지 않는다 — enable 하지 않은 소비자는 테이블이 서지 않는다.
system-settings = []

[dependencies]
error = { path = "../error" }

anyhow = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
