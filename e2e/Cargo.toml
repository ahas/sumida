[package]
name = "e2e"
publish = false
version = "0.3.0"
edition = "2024"

[features]
# Mirrors the api feature of the same name, so the harness builds the schema that feature expects.
system-settings = ["api/system-settings", "entity/system-settings"]

[dependencies]
api = { path = "../api", features = ["full-local"] }
infra = { path = "../infra" }
entity = { path = "../entity" }
error = { path = "../error" }

anyhow = { workspace = true }
sea-orm = { workspace = true }
sea-orm-migration.workspace = true

dotenvy = "0.15.7"
tokio = { version = "1.45.0", features = ["macros", "rt-multi-thread"] }
axum.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
reqwest = { version = "0.13.2", features = ["json", "cookies", "stream", "multipart"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
