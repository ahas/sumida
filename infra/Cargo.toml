[package]
name = "infra"
version = "0.3.0"
edition = "2024"

[lib]
path = "src/lib.rs"

[features]
default = ["session-store-redis"]
aws = ["aws-config"]
aws-s3 = ["aws", "aws-sdk-s3"]
aws-dynamodb = ["aws", "aws-sdk-dynamodb"]
session = []
session-store-redis = ["session", "tower-sessions-redis-store", "fred"]
session-store-aws-dynamodb = [
  "session",
  "aws-dynamodb",
  "tower-sessions-dynamodb-store",
]
jwt = ["jsonwebtoken", "jsonwebtoken/rust_crypto"]
# Shared operational settings: the login lockout policy is read from the runtime store.
system-settings = ["entity/system-settings"]

[dependencies]
entity = { path = "../entity" }
error = { path = "../error" }

anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
cfg-if = "1.0"
chrono = { workspace = true }
hmac = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
humantime = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
lazy_static = { workspace = true }
time = { workspace = true }
sea-orm = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tower-sessions = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }

aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-dynamodb = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
figment = { version = "0.10", features = ["toml", "env"] }
fred = { version = "10.1.0", optional = true }
tower-sessions-redis-store = { version = "0.16.0", optional = true }
tower-sessions-dynamodb-store = { version = "0.3.0", optional = true }

socketioxide = { version = "0.18.2", features = ["state"] }
socketioxide-core = "0.17.0"
thiserror = "2.0.18"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uaparser = "0.6.4"
lru = "0.16.4"
axum-client-ip = { version = "1.3.1", features = ["forwarded-header"] }

[dev-dependencies]
# Jail (hermetic env/file sandbox) for settings tests lives behind the "test" feature.
figment = { version = "0.10", features = ["test"] }
