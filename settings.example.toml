[server]
host = "0.0.0.0:7997"
stage = "dev"
logging = "info"

[database]
url = "postgres://user:password@localhost:5432/sumida"
logging = "INFO"

[aws]
region = "ap-northeast-2"

[aws.s3]
bucket = "your-s3-bucket"

[session]
ip_source = "ConnectInfo"

# When using the session-store-redis feature
[session.redis]
url = "redis://0.0.0.0:6379/0"

# When using the session-store-aws-dynamodb feature
# [session.dynamodb]
# table = "your-sessions-table"

[storage]
directory = "/static/upload"

# Global limits for the generic /files upload (board uploads follow per-board settings).
# When omitted, size/extension are unlimited but dangerous MIME types are always blocked.
[storage.upload]
max-file-size = 0                  # bytes; 0 = unlimited
allowed-file-types = []            # lowercase extension whitelist; empty = allow all

[session.cookie]
name = "sumida.sid"
secure = true
same_site = "strict"

[smtp]
username = "smtp_user"
password = "REPLACE_WITH_SMTP_PASSWORD"
server = "smtp.example.com"
auth = "LOGIN"
# Newer options (available after the G4 SMTP TLS work):
# port = 587
# tls = "starttls"  # "none" | "starttls" | "implicit"

# When using JWT
# [jwt]
# secret = "REPLACE_WITH_JWT_SECRET"  # jwt-secret-store-static feature; must be at least 32 bytes
# [jwt.expiry]
# access_token = "15m"
# refresh_token = "7d"
# remember_me = "30d"

# Membership / billing. All keys are optional; defaults shown.
[membership]
default-currency = "KRW"                    # ISO 4217; used when a plan/wallet omits a currency
default-gate-order = "subscription-first"   # entitlement gate order: "subscription-first" | "credit-first"
# credit-default-expiry-days = 365          # default expiry for granted credit lots; omit = never expire
expiring-soon-notify-days = 7               # days before period end to send the "expiring soon" notice
# credit-low-balance-threshold = 100        # send a low-balance alert at/below this balance; omit = disabled
grace-days = 0                              # entitlement grace window after a failed renewal; 0 = none
max-dunning-attempts = 0                    # renewal-charge retries during grace; 0 = none
tax-percent-bp = 0                          # sales tax at checkout, in basis points (1000 = 10%); 0 = none
pending-purchase-ttl-hours = 0              # expire unconfirmed pending purchases (reversing coupons) after N hours; 0 = off

# Payment gateway (PG). provider: "none" (default, disabled) | "portone" | "mock" (tests).
[membership.payment]
provider = "none"
# api-base = "https://api.portone.io"
# api-secret = "REPLACE_WITH_PORTONE_API_SECRET"
# store-id = "store-..."
# channel-key = "channel-..."   # for billing-key (recurring) payments on multi-channel stores
# webhook-secret = "whsec_..."
