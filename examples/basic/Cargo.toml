[package]
name = "basic"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "app"

[features]
default = ["full-local"]
full-local = ["sumida/full-local"]

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[[bin]]
name = "create_dummy_board_posts"
path = "src/bin/create_dummy_board_posts.rs"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true, features = ["http2", "macros", "multipart"] }
chrono = { workspace = true }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
entity = { path = "../../entity" }
sea-orm = { workspace = true }
sea-orm-migration.workspace = true
serde_json = { workspace = true }
sumida = { path = "../../", default-features = false }
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
