[package]
name = "basic"
version = "0.2.0"
edition = "2024"
publish = false
default-run = "app"

[features]
default = ["full-local"]
full-local = ["sumida/full-local"]
# sumida 가 세우는 라우트의 문서 조각을 링크한다. 이 예제는 그것을 합쳐 내보내지 않으므로,
# 켜도 서는 라우터는 같다 — 조각이 이 빌드에서도 만들어지는지를 확인하는 자리다.
openapi = ["sumida/openapi"]

[[bin]]
name = "app"
path = "src/bin/app.rs"

[[bin]]
name = "migration"
path = "src/bin/migration.rs"

[[bin]]
name = "create_dummy_board_posts"
path = "src/bin/create_dummy_board_posts.rs"

[dependencies]
anyhow = { workspace = true, features = ["backtrace"] }
axum = { workspace = true, features = ["http2", "macros", "multipart"] }
chrono = { workspace = true }
color-eyre = "0.6.5"
dotenvy = "0.15.7"
entity = { path = "../../entity" }
sea-orm = { workspace = true }
sea-orm-migration.workspace = true
serde_json = { workspace = true }
sumida = { path = "../../", default-features = false }
tokio.workspace = true
tower.workspace = true
tower-http = { workspace = true, features = ["full"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3.22", features = ["env-filter", "fmt", "json"] }
