# E2E test settings. Copy to settings.e2e.toml and fill in real values.
# The e2e harness loads this via SUMIDA_SETTINGS (see .env.e2e).
# Use a DEDICATED test database — the harness wipes and re-migrates it.

[server]
host = "0.0.0.0:7997"
stage = "test"
logging = "info"

[database]
# Must point to a dedicated test DB (e.g. sumida_test), NOT a real one.
url = "postgres://user:password@localhost:5432/sumida_test"
logging = "INFO"
# 케이스마다 서버를 새로 띄우므로 풀도 케이스마다 하나씩 생긴다. 지정하지 않으면 SeaORM 기본값이
# 풀당 100 이고 postgres 의 max_connections 도 100 이라, 케이스 하나가 상한을 다 먹는다. 그러면
# 병렬 실행이 `Connection pool timed out` 으로 무작위로 깨지고, 그걸 피하려 `--test-threads=1` 을
# 쓰면 스위트가 네 배 느려진다.
#
# 값은 실측으로 정했다. 가장 큰 테스트 바이너리 기준 5 에서 62 초, 15 에서 53 초, 30 에서 51 초 —
# 5 는 커넥션을 기다리느라 스스로 병목이 되고, 15 위로는 평평하다. 제품 스위트는 한 번에 하나씩
# 도니 한 서비스가 서버 상한을 다 써도 된다.
max_connections = 15
acquire_timeout = "10s"

[aws]
region = "ap-northeast-2"

[aws.s3]
bucket = "your-test-bucket"

[session]
ip_source = "ConnectInfo"

[session.redis]
url = "redis://0.0.0.0:6379/0"

[storage]
directory = "/tmp/sumida-e2e-upload"

[storage.upload]
max-file-size = 0
allowed-file-types = []

[session.cookie]
name = "sumida.test.sid"
secure = false
same_site = "strict"

[smtp]
username = "smtp_user"
password = "REPLACE_WITH_SMTP_PASSWORD"
server = "smtp.example.com"
auth = "LOGIN"

# jwt-secret-store-static feature (full-local): secret must be at least 32 bytes
[jwt]
secret = "REPLACE_WITH_JWT_SECRET_AT_LEAST_32_BYTES"
[jwt.expiry]
access_token = "15m"
refresh_token = "7d"
remember_me = "30d"

# Membership values exercised by the e2e suites. Without these, the dependent
# tests self-skip (api/tests/{maintenance,subscription_lifecycle,coupon,payment}.rs).
[membership]
credit-low-balance-threshold = 100   # maintenance low-balance alert
grace-days = 3                       # post-renewal grace window
max-dunning-attempts = 2             # dunning retry cap
tax-percent-bp = 1000                # 10% checkout tax

[membership.payment]
# Deterministic mock PG (no real PortOne calls).
provider = "mock"
